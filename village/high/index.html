<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sky Village</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #9fc9e8;
        font-family: Georgia, 'Times New Roman', serif;
      }
      #app canvas {
        display: block;
      }
      #hud {
        position: fixed;
        left: 20px;
        bottom: 18px;
        color: #fff;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.45);
        pointer-events: none;
        user-select: none;
        opacity: 0.85;
      }
      #hud h1 {
        margin: 0 0 6px;
        font-size: 18px;
        font-weight: normal;
        letter-spacing: 0.06em;
      }
      #track {
        width: 160px;
        height: 3px;
        background: rgba(255, 255, 255, 0.3);
        border-radius: 2px;
        overflow: hidden;
      }
      #bar {
        height: 100%;
        background: #fff;
        transform-origin: left;
        transform: scaleX(0);
      }
      #clock {
        margin-top: 5px;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">
      <h1>Sky Village</h1>
      <div id="track"><div id="bar"></div></div>
      <div id="clock">0:00 / 1:00</div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
